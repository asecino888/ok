<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雷雲音樂律動播放器</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>雷雲音樂律動播放器</h1>

      <section class="controls" aria-label="播放器控制面板">
        <label class="file-input">
          <span>選擇音樂</span>
          <input id="audioFile" type="file" accept="audio/*" />
        </label>

        <label class="file-input">
          <span>選擇雷雲圖片（可多選）</span>
          <input id="imageFiles" type="file" accept="image/*" multiple />
        </label>

        <button id="playPauseBtn" disabled>播放</button>

        <label class="slider-row" for="sensitivityRange">
          <span>音量敏感度</span>
          <input
            id="sensitivityRange"
            type="range"
            min="0.5"
            max="3"
            step="0.05"
            value="1.2"
          />
          <output id="sensitivityValue">1.20</output>
        </label>

        <label class="slider-row" for="lightningThresholdRange">
          <span>閃電門檻</span>
          <input
            id="lightningThresholdRange"
            type="range"
            min="1"
            max="2.5"
            step="0.05"
            value="1.6"
          />
          <output id="lightningThresholdValue">1.60</output>
        </label>
      </section>

      <section class="stage-wrapper" aria-label="視覺舞台">
        <div class="stage" id="stage" role="img" aria-label="雷雲律動畫面">
          <img class="layer active" id="layerA" alt="雷雲畫面 A" />
          <img class="layer" id="layerB" alt="雷雲畫面 B" />
          <div class="hint" id="hint">請先選擇音樂與雷雲圖片</div>
        </div>
      </section>

      <p class="status" id="statusText">尚未載入音樂。</p>

      <audio id="audioElement" preload="auto"></audio>
    </main>

    <script src="script.js"></script>
  </body>
</html>
